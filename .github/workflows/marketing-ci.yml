name: Marketing CI

on:
  pull_request:
    paths:
      - "src/marketing*.py"
      - "tests/test_marketing*.py"
      - ".github/workflows/marketing-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/marketing*.py"
      - "tests/test_marketing*.py"
      - ".github/workflows/marketing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPYMARY_DB_PATH: ${{ runner.temp }}/copymary-marketing-ci.sqlite3
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile marketing modules
        run: |
          python -m compileall -q src/marketing*.py

      - name: Run marketing tests
        run: pytest -q tests/test_marketing*.py

      - name: Marketing center smoke test
        run: |
          python - <<'PY'
          from src.marketing_class_center import (
              FUNNEL_STAGES,
              SECTIONS,
              content_metrics,
              funnel_stage_counts,
              marketing_diagnosis,
          )

          assert len(SECTIONS) == 8
          assert FUNNEL_STAGES[0] == "Reconocimiento"
          assert FUNNEL_STAGES[-1] == "Cliente"

          content = [
              {
                  "funnel_stage": "Reconocimiento",
                  "status": "Medido",
                  "views": 1000,
                  "interactions": 100,
                  "clicks": 40,
                  "leads": 10,
                  "sales": 2,
                  "revenue": 60,
                  "spend": 20,
              }
          ]
          metrics = content_metrics(content)
          assert metrics["roas"] == 3
          assert funnel_stage_counts(content)["Reconocimiento"] == 1
          assert marketing_diagnosis(content)
          print("Marketing smoke test OK")
          PY
